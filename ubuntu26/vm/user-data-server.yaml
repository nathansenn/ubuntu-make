#cloud-config
hostname: resolute-perf
manage_etc_hosts: true
users:
  - name: ubuntu
    gecos: Ubuntu
    sudo: ALL=(ALL) NOPASSWD:ALL
    groups: [adm, sudo]
    shell: /bin/bash
    lock_passwd: false
    ssh_authorized_keys:
      - SSH_PUBKEY_PLACEHOLDER
ssh_pwauth: true
package_update: true
package_upgrade: true
packages:
  - openssh-server
  - build-essential
  - git
  - python3
  - python3-yaml
  - pkg-config
  - zlib1g-dev
  - ubuntu-desktop-minimal
runcmd:
  - [systemctl, enable, --now, ssh]
  - [touch, /var/lib/cloud/instance/packages-done]
final_message: "Ubuntu 26.04 is ready after $UPTIME seconds"
